<svg xmlns="http://www.w3.org/2000/svg" width="520" height="190" viewBox="0 0 520 190" fill="none" role="img" aria-labelledby="bellis-title bellis-desc">
  <title id="bellis-title">Bellis: Artisan perfumery / E-commerce</title>
  <desc id="bellis-desc">Project card for Bellis, a web experience for an artisan perfumery focused on product presentation, personalization, a shopping cart and a WhatsApp-based sales flow. Built with React, TypeScript and Tailwind CSS. Category: E-commerce / User Experience.</desc>

  <defs>
    <clipPath id="bellis-panel-clip">
      <rect x="344" y="20" width="152" height="92" rx="6"/>
    </clipPath>
  </defs>

  <!-- Card -->
  <rect x="0.5" y="0.5" width="519" height="189" rx="10" fill="#0D1117" stroke="#30363D"/>

  <!-- Eyebrow -->
  <text x="24" y="36" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="10" letter-spacing="1.6" fill="#8B949E">PROJECT / <tspan fill="#B6F09C">02</tspan></text>

  <!-- Title -->
  <text x="23" y="72" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="27" font-weight="600" letter-spacing="-0.4" fill="#F0F6FC">Bellis</text>

  <!-- Description -->
  <text x="24" y="96" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#8B949E">Artisan perfumery<tspan fill="#30363D"> / </tspan>E-commerce</text>

  <!-- Product motif panel -->
  <rect x="344" y="20" width="152" height="92" rx="6" fill="#D8B99C" fill-opacity="0.035"/>
  <g clip-path="url(#bellis-panel-clip)">
    <!-- Fine grid -->
    <path d="M363 20V112M382 20V112M401 20V112M439 20V112M458 20V112M477 20V112M344 39H496M344 58H496M344 77H496M344 96H496" stroke="#F0F6FC" stroke-opacity="0.035"/>
    <!-- Shelf line -->
    <path d="M358 100.5H482" stroke="#30363D"/>
  </g>
  <rect x="344.5" y="20.5" width="151" height="91" rx="5.5" stroke="#30363D"/>

  <!-- Bottle: liquid -->
  <rect x="407" y="74" width="26" height="23" rx="3" fill="#D8B99C" fill-opacity="0.16"/>
  <path d="M407 74.5H433" stroke="#D8B99C" stroke-opacity="0.65"/>
  <!-- Bottle: body -->
  <rect x="404.5" y="56.5" width="31" height="43.5" rx="5" stroke="#F0F6FC" stroke-opacity="0.6"/>
  <!-- Bottle: label -->
  <path d="M413 64.5H427" stroke="#8B949E" stroke-opacity="0.6"/>
  <!-- Bottle: neck -->
  <rect x="414.5" y="47.5" width="11" height="9" stroke="#F0F6FC" stroke-opacity="0.6"/>
  <!-- Bottle: cap and nozzle -->
  <rect x="411" y="35" width="18" height="12" rx="2" fill="#D8B99C" fill-opacity="0.85"/>
  <rect x="429" y="38.5" width="5" height="3" rx="0.8" fill="#D8B99C" fill-opacity="0.6"/>

  <!-- Mist -->
  <circle cx="441.5" cy="39.5" r="1.4" fill="#B6F09C" fill-opacity="0.9"/>
  <circle cx="448" cy="35" r="1.2" fill="#B6F09C" fill-opacity="0.6"/>
  <circle cx="447.5" cy="43.5" r="1.1" fill="#B6F09C" fill-opacity="0.5"/>
  <circle cx="455" cy="39" r="1" fill="#B6F09C" fill-opacity="0.35"/>
  <circle cx="454" cy="30.5" r="0.9" fill="#B6F09C" fill-opacity="0.25"/>

  <!-- Dimension annotation -->
  <path d="M474.5 35V100M471 35.5H478M471 99.5H478" stroke="#8B949E" stroke-opacity="0.4"/>
  <path d="M474.5 40V95" stroke="#8B949E" stroke-opacity="0.25" stroke-dasharray="2 3"/>

  <!-- Divider -->
  <path d="M24 128.5H496" stroke="#30363D"/>

  <!-- Tech stack -->
  <text x="24" y="153" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5" fill="#F0F6FC">React<tspan fill="#8B949E"> · </tspan>TypeScript<tspan fill="#8B949E"> · </tspan>Tailwind CSS</text>

  <!-- Category -->
  <text x="24" y="172" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="9" letter-spacing="1.3" fill="#8B949E">E-COMMERCE / USER EXPERIENCE</text>

  <!-- Link cue -->
  <path d="M484 168L494 158M486.5 158H494V165.5" stroke="#B6F09C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
